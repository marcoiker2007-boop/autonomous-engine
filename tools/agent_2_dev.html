<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a202c;
        }
    </style>
</head>
<body class="text-white">
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">JSON to TypeScript/Python Converter</h1>
            <div>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">Share Tool</button>
                <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="col-span-1 md:col-span-1">
                <textarea id="jsonInput" class="w-full h-64 p-2 bg-gray-800 text-white rounded" placeholder="Paste JSON here..."></textarea>
                <button id="convertBtn" class="mt-2 w-full bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">Convert</button>
            </div>
            <div class="col-span-1 md:col-span-1">
                <h2 class="text-xl font-bold mb-2">TypeScript</h2>
                <pre id="typescriptOutput" class="w-full h-64 p-2 bg-gray-800 text-white rounded overflow-auto"></pre>
            </div>
            <div class="col-span-1 md:col-span-1">
                <h2 class="text-xl font-bold mb-2">Python</h2>
                <pre id="pythonOutput" class="w-full h-64 p-2 bg-gray-800 text-white rounded overflow-auto"></pre>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('convertBtn').addEventListener('click', function() {
            const jsonInput = document.getElementById('jsonInput').value.trim();
            let jsonObject;
            try {
                jsonObject = JSON.parse(jsonInput);
            } catch (err) {
                alert('Invalid JSON');
                return;
            }

            const typeScriptOutput = convertJSONToTypeScript(jsonObject);
            document.getElementById('typescriptOutput').textContent = typeScriptOutput;

            const pythonOutput = convertJSONToPython(jsonObject);
            document.getElementById('pythonOutput').textContent = pythonOutput;
        });

        function convertJSONToTypeScript(jsonObject) {
            let result = 'interface RootObject {\n';
            for (const key in jsonObject) {
                const type = typeof jsonObject[key];
                result += `  ${key}: ${mapType(type)};\n`;
            }
            result += '}';
            return result;
        }

        function mapType(type) {
            switch(type) {
                case 'string': return 'string';
                case 'number': return 'number';
                case 'boolean': return 'boolean';
                case 'object': return 'any';
                default: return 'any';
            }
        }

        function convertJSONToPython(jsonObject) {
            let result = 'class RootObject:\n';
            for (const key in jsonObject) {
                const type = typeof jsonObject[key];
                result += `    ${key}: ${mapPythonType(type)}\n`;
            }
            return result;
        }

        function mapPythonType(type) {
            switch(type) {
                case 'string': return 'str';
                case 'number': return 'float';
                case 'boolean': return 'bool';
                case 'object': return 'Any';
                default: return 'Any';
            }
        }
    </script>
</body>
</html>
