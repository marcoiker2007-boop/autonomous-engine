name: Autonomous Engine Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install openai

      - name: Run Generator Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generator.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Autonomous Engine Bot"
          git config --global user.email "bot@autonomous-engine.local"
          git add index.html
          git commit -m "Auto-generated updated web asset" || exit 0
          git push
