<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Gas Fee & Gwei Profit Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
        input[type="number"] { background-color: #2d3748; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
    <div class="bg-gray-800 text-white p-4 flex justify-between w-full max-w-2xl">
        <h1 class="text-xl font-bold">Web3 Gas Fee & Gwei Profit Estimator</h1>
        <div>
            <button onclick="shareTool()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Share Tool</button>
            <button onclick="supportDeveloper()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
        </div>
    </div>
    <div class="bg-gray-900 p-6 rounded-lg shadow-lg mt-6 w-full max-w-md">
        <form id="estimatorForm" class="space-y-4">
            <div>
                <label for="gasPrice" class="block text-sm font-medium">Gas Price (Gwei):</label>
                <input type="number" id="gasPrice" class="mt-1 p-2 w-full rounded" step="0.01" required>
            </div>
            <div>
                <label for="gasLimit" class="block text-sm font-medium">Gas Limit:</label>
                <input type="number" id="gasLimit" class="mt-1 p-2 w-full rounded" required>
            </div>
            <div>
                <label for="profitPerTx" class="block text-sm font-medium">Profit per Transaction (Gwei):</label>
                <input type="number" id="profitPerTx" class="mt-1 p-2 w-full rounded" step="0.01" required>
            </div>
            <div>
                <button type="button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full" onclick="calculateProfit()">Calculate</button>
            </div>
        </form>
        <div id="result" class="mt-4 text-center text-lg font-bold"></div>
    </div>
    <script>
        function calculateProfit() {
            const gasPrice = parseFloat(document.getElementById('gasPrice').value);
            const gasLimit = parseFloat(document.getElementById('gasLimit').value);
            const profitPerTx = parseFloat(document.getElementById('profitPerTx').value);
            if (isNaN(gasPrice) || isNaN(gasLimit) || isNaN(profitPerTx)) {
                alert('Please enter valid numbers');
                return;
            }
            const gasFee = gasPrice * gasLimit;
            const totalProfit = profitPerTx - gasFee;
            document.getElementById('result').innerText = `Estimated Profit: ${totalProfit.toFixed(2)} Gwei`;
        }

        function shareTool() {
            alert('Share this tool with your friends!');
        }

        function supportDeveloper() {
            alert('Thank you for supporting the developer!');
        }
    </script>
</body>
</html>
