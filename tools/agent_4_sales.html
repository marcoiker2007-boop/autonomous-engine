<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Outreach Subject Line Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
        }
        .banner {
            background-color: #333;
            padding: 10px;
        }
        .button {
            background-color: #4a90e2;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            margin: 0 4px;
        }
    </style>
</head>
<body>
    <div class="banner flex justify-between items-center">
        <h1 class="text-xl">Cold Outreach Subject Line Analyzer</h1>
        <div>
            <a href="#" class="button">Share Tool</a>
            <a href="#" class="button">Support Developer</a>
        </div>
    </div>
    <div class="container mx-auto mt-8 p-4">
        <textarea id="subjectLine" class="w-full p-2 bg-gray-800 border border-gray-600 rounded-md" rows="2" placeholder="Enter subject line here..."></textarea>
        <button onclick="analyzeSubjectLine()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Analyze</button>
        <div id="result" class="mt-4 p-4 bg-gray-800 border border-gray-600 rounded-md hidden"></div>
    </div>
    <script>
        function analyzeSubjectLine() {
            const subjectLine = document.getElementById('subjectLine').value;
            let resultText = '';

            if (subjectLine.length < 10) {
                resultText = 'Subject line is too short.';
            } else if (subjectLine.length > 50) {
                resultText = 'Subject line is too long.';
            } else {
                resultText = 'Subject line length is good.';
            }

            const powerWords = ['exclusive', 'limited time', 'offer', 'free', 'urgent'];
            const foundWords = powerWords.filter(word => subjectLine.toLowerCase().includes(word)).join(', ');

            if (foundWords) {
                resultText += ' Contains power words: ' + foundWords + '.';
            } else {
                resultText += ' No power words found.';
            }

            const resultDiv = document.getElementById('result');
            resultDiv.textContent = resultText;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
