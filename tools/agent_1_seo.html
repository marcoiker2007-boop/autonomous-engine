<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meta & OpenGraph Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c; /* Dark mode background */
            color: #f7fafc; /* Light text color */
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 space-y-4">
    <header class="w-full flex justify-between items-center py-4 bg-gray-800 px-6 shadow-lg">
        <h1 class="text-xl font-bold text-white">Meta & OpenGraph Previewer</h1>
        <div class="space-x-4">
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" onclick="shareTool()">Share Tool</button>
            <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" onclick="supportDeveloper()">Support Developer</button>
        </div>
    </header>

    <main class="w-full max-w-3xl space-y-4">
        <div>
            <label for="meta-input" class="block text-sm font-medium">Enter Meta & OpenGraph Tags:</label>
            <textarea id="meta-input" class="w-full mt-1 p-2 bg-gray-700 text-white rounded border border-gray-600 focus:outline-none focus:border-blue-500" rows="10"
                placeholder="<meta name='description' content='Example description'>"></textarea>
        </div>
        <div class="bg-gray-900 p-4 rounded shadow-lg">
            <h2 class="text-lg font-semibold">Live Preview</h2>
            <div id="preview" class="mt-2 p-4 bg-gray-800 rounded border border-gray-700">
                <!-- Live preview content appears here -->
            </div>
        </div>
    </main>

    <script>
        document.getElementById('meta-input').addEventListener('input', updatePreview);

        function updatePreview() {
            const input = document.getElementById('meta-input').value;
            const preview = document.getElementById('preview');
            preview.innerHTML = input;
        }

        function shareTool() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Tool URL copied to clipboard!');
            });
        }

        function supportDeveloper() {
            window.open('https://www.buymeacoffee.com/developer', '_blank');
        }
    </script>
</body>
</html>
