<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
        textarea { resize: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">
    <div class="w-full text-center py-4 bg-gray-800">
        <button class="px-4 py-2 bg-blue-600 text-white rounded mr-2" onclick="shareTool()">Share Tool</button>
        <button class="px-4 py-2 bg-green-600 text-white rounded" onclick="supportDeveloper()">Support Developer</button>
    </div>
    <div class="w-full max-w-2xl p-4">
        <h1 class="text-2xl font-bold mb-4">JSON to TypeScript/Python Converter</h1>
        <textarea id="jsonInput" class="w-full h-40 p-2 mb-4 bg-gray-700 text-white" placeholder="Paste JSON here"></textarea>
        <div class="flex justify-between mb-4">
            <button class="px-4 py-2 bg-blue-500 text-white rounded" onclick="convertToTypeScript()">Convert to TypeScript</button>
            <button class="px-4 py-2 bg-green-500 text-white rounded" onclick="convertToPython()">Convert to Python</button>
        </div>
        <textarea id="output" class="w-full h-40 p-2 bg-gray-700 text-white" readonly placeholder="Output"></textarea>
    </div>
    <script>
        function convertToTypeScript() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const typeScript = jsonToTypeScript(jsonObject);
                document.getElementById('output').value = typeScript;
            } catch (error) {
                alert('Invalid JSON');
            }
        }

        function convertToPython() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const python = jsonToPython(jsonObject);
                document.getElementById('output').value = python;
            } catch (error) {
                alert('Invalid JSON');
            }
        }

        function jsonToTypeScript(obj, indent = '') {
            if (Array.isArray(obj)) {
                return obj.length ? jsonToTypeScript(obj[0], indent) + '[]' : 'any[]';
            }
            if (typeof obj === 'object' && obj !== null) {
                let tsInterface = '{\n';
                for (const key in obj) {
                    tsInterface += `${indent}  ${key}: ${jsonToTypeScript(obj[key], indent + '  ')};\n`;
                }
                return tsInterface + indent + '}';
            }
            return typeof obj;
        }

        function jsonToPython(obj, indent = 0) {
            const spacing = ' '.repeat(indent);
            if (Array.isArray(obj)) {
                return obj.length ? `List[${jsonToPython(obj[0], indent + 4)}]` : 'List[Any]';
            }
            if (typeof obj === 'object' && obj !== null) {
                let pyClass = 'Dict[';
                for (const key in obj) {
                    pyClass += `\n${spacing}  "${key}": ${jsonToPython(obj[key], indent + 4)},`;
                }
                return pyClass + `\n${spacing}]`;
            }
            return typeof obj === 'string' ? 'str' : typeof obj;
        }

        function shareTool() {
            alert('Share this tool with your friends!');
        }

        function supportDeveloper() {
            alert('Support the developer!');
        }
    </script>
</body>
</html>
