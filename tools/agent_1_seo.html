<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meta & OpenGraph Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #fff;
        }

        .banner {
            background-color: #2d3748;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="banner flex justify-between items-center p-4">
        <h1 class="text-2xl font-bold">Live Meta & OpenGraph Previewer</h1>
        <div class="flex space-x-4">
            <button onclick="shareTool()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Share Tool</button>
            <button onclick="supportDeveloper()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
        </div>
    </div>
    <div class="container mx-auto p-4">
        <div class="mb-4">
            <label for="metaInput" class="block text-sm font-medium mb-2">Enter URL or HTML:</label>
            <textarea id="metaInput" rows="4" class="w-full p-2 text-black" placeholder="Paste your HTML or URL here..."></textarea>
        </div>
        <button onclick="previewMeta()" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">Preview</button>
        <div id="previewArea" class="mt-4"></div>
    </div>

    <script>
        function shareTool() {
            navigator.share({
                title: 'Live Meta & OpenGraph Previewer',
                text: 'Check out this tool!',
                url: window.location.href,
            }).catch(console.error);
        }

        function supportDeveloper() {
            window.open('https://www.buymeacoffee.com/', '_blank');
        }

        function previewMeta() {
            const input = document.getElementById('metaInput').value;
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = '';

            let url;
            try {
                url = new URL(input);
            } catch (_) {
                previewArea.innerHTML = '<p class="text-red-500">Invalid URL or HTML.</p>';
                return;
            }

            fetch(url)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const metaTags = doc.querySelectorAll('meta[property^="og:"], meta[name^="twitter:"], meta[name="description"], meta[name="keywords"], meta[name="author"]');
                    let output = '<h2 class="text-xl font-bold mb-2">Meta Tags:</h2><ul class="list-disc pl-5">';
                    
                    metaTags.forEach(tag => {
                        const name = tag.getAttribute('name') || tag.getAttribute('property');
                        const content = tag.getAttribute('content');
                        output += `<li><strong>${name}:</strong> ${content}</li>`;
                    });

                    output += '</ul>';
                    previewArea.innerHTML = output;
                })
                .catch(error => {
                    previewArea.innerHTML = `<p class="text-red-500">Error fetching URL: ${error.message}</p>`;
                });
        }
    </script>
</body>

</html>
