<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-2xl">
        <header class="flex justify-between mb-6">
            <h1 class="text-2xl font-bold">JSON to TypeScript/Python Converter</h1>
            <div>
                <button onclick="shareTool()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">Share Tool</button>
                <button onclick="supportDeveloper()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
            </div>
        </header>
        <div class="bg-gray-800 p-4 rounded-lg shadow-lg">
            <textarea id="jsonInput" class="w-full h-40 p-2 bg-gray-900 border border-gray-700 rounded-lg text-sm" placeholder="Paste your JSON here..."></textarea>
            <div class="flex justify-between mt-4">
                <button onclick="convertToTypeScript()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Convert to TypeScript</button>
                <button onclick="convertToPython()" class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded">Convert to Python</button>
            </div>
            <pre id="output" class="mt-4 p-2 bg-gray-900 border border-gray-700 rounded-lg text-sm overflow-auto"></pre>
        </div>
    </div>

    <script>
        function shareTool() {
            alert('Use the URL to share this tool.');
        }

        function supportDeveloper() {
            alert('Thank you for your support!');
        }

        function convertToTypeScript() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const typeScriptOutput = jsonToTypeScript(jsonObject);
                document.getElementById('output').textContent = typeScriptOutput;
            } catch (e) {
                document.getElementById('output').textContent = 'Invalid JSON input.';
            }
        }

        function convertToPython() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const pythonOutput = jsonToPython(jsonObject);
                document.getElementById('output').textContent = pythonOutput;
            } catch (e) {
                document.getElementById('output').textContent = 'Invalid JSON input.';
            }
        }

        function jsonToTypeScript(jsonObject) {
            let result = 'type ConvertedType = {\n';
            for (const [key, value] of Object.entries(jsonObject)) {
                result += `  ${key}: ${typeof value};\n`;
            }
            result += '};';
            return result;
        }

        function jsonToPython(jsonObject) {
            let result = 'class ConvertedType:\n';
            for (const [key, value] of Object.entries(jsonObject)) {
                result += `  ${key}: ${typeof value === 'object' ? 'dict' : typeof value}\n`;
            }
            return result;
        }
    </script>
</body>
</html>
