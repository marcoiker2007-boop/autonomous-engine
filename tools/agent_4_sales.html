<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Outreach Subject Line Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a202c; color: #f7fafc; }
        .btn { transition: background-color 0.2s; }
    </style>
</head>
<body class="flex flex-col items-center p-4">
    <div class="w-full max-w-2xl">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Cold Outreach Subject Line Analyzer</h1>
            <div>
                <button class="btn bg-blue-500 hover:bg-blue-700 text-white py-2 px-4 rounded mr-2" onclick="shareTool()">Share Tool</button>
                <button class="btn bg-green-500 hover:bg-green-700 text-white py-2 px-4 rounded" onclick="supportDeveloper()">Support Developer</button>
            </div>
        </div>
        <textarea id="subjectLine" class="w-full p-2 rounded bg-gray-700 text-white border-none focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Enter your subject line here..."></textarea>
        <button class="btn bg-purple-500 hover:bg-purple-700 text-white py-2 px-4 rounded mt-4" onclick="analyzeSubjectLine()">Analyze</button>
        <div id="analysisResult" class="mt-4 p-4 rounded bg-gray-800"></div>
    </div>

    <script>
        function shareTool() {
            alert('Use this tool to analyze your cold outreach subject lines!');
        }

        function supportDeveloper() {
            alert('Thank you for considering support!');
        }

        function analyzeSubjectLine() {
            const subjectLine = document.getElementById('subjectLine').value.trim();
            const resultDiv = document.getElementById('analysisResult');
            if (subjectLine === "") {
                resultDiv.textContent = "Please enter a subject line.";
                return;
            }
            
            const words = subjectLine.split(/\s+/);
            const wordCount = words.length;
            const hasQuestion = subjectLine.includes('?');
            const isTooLong = subjectLine.length > 50;

            let feedback = `Word Count: ${wordCount}.`;
            feedback += hasQuestion ? " Contains a question." : " Does not contain a question.";
            feedback += isTooLong ? " Consider shortening your subject line." : " Subject line length is appropriate.";

            resultDiv.textContent = feedback;
        }
    </script>
</body>
</html>
