<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meta & OpenGraph Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #1a202c;
            color: #cbd5e0; 
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Meta & OpenGraph Previewer</h1>
            <div>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mx-2" onclick="shareTool()">Share Tool</button>
                <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mx-2" onclick="supportDeveloper()">Support Developer</button>
            </div>
        </header>
        <main>
            <div class="mb-4">
                <label for="urlInput" class="block text-sm font-medium text-gray-300">Enter URL:</label>
                <input type="text" id="urlInput" class="mt-1 block w-full bg-gray-700 text-white border border-gray-600 rounded p-2" placeholder="https://example.com">
            </div>
            <button class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded mb-4" onclick="previewMeta()">Preview Meta</button>
            <div id="metaPreview" class="bg-gray-800 p-4 rounded border border-gray-700"></div>
        </main>
    </div>
    <script>
        function shareTool() {
            navigator.share({
                title: 'Meta & OpenGraph Previewer',
                text: 'Check out this tool!',
                url: window.location.href
            }).catch(console.error);
        }

        function supportDeveloper() {
            window.open('https://www.paypal.com/paypalme/supportdev', '_blank');
        }

        function previewMeta() {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                alert('Please enter a valid URL.');
                return;
            }

            fetch(`https://cors-anywhere.herokuapp.com/${url}`)
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const metaTags = doc.querySelectorAll('meta');
                    let metaContent = '<h2 class="text-xl font-bold mb-2">Meta Tags</h2><ul class="list-disc pl-5">';
                    
                    metaTags.forEach(tag => {
                        const name = tag.getAttribute('name') || tag.getAttribute('property') || 'N/A';
                        const content = tag.getAttribute('content') || 'N/A';
                        metaContent += `<li><strong>${name}:</strong> ${content}</li>`;
                    });

                    metaContent += '</ul>';
                    document.getElementById('metaPreview').innerHTML = metaContent;
                })
                .catch(error => {
                    document.getElementById('metaPreview').innerHTML = `<p class="text-red-500">Error retrieving meta tags: ${error.message}</p>`;
                });
        }
    </script>
</body>
</html>
