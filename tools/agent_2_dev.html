<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
        .banner { background-color: #2d3748; padding: 10px; text-align: center; }
        .banner button { margin: 0 5px; }
    </style>
</head>
<body>
    <div class="banner">
        <button class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded" onclick="shareTool()">Share Tool</button>
        <button class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded" onclick="supportDeveloper()">Support Developer</button>
    </div>
    <div class="container mx-auto p-4">
        <h1 class="text-center text-3xl mb-4">JSON to TypeScript/Python Converter</h1>
        <div class="flex justify-center">
            <textarea id="jsonInput" class="w-1/2 h-64 p-2 bg-gray-800 text-white rounded focus:outline-none" placeholder="Paste your JSON here..."></textarea>
        </div>
        <div class="flex justify-center my-4">
            <button id="convertTS" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded mx-2">Convert to TypeScript</button>
            <button id="convertPy" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded mx-2">Convert to Python</button>
        </div>
        <div class="flex justify-center">
            <textarea id="output" class="w-1/2 h-64 p-2 bg-gray-800 text-white rounded focus:outline-none" placeholder="Converted code will appear here..." readonly></textarea>
        </div>
    </div>
    <script>
        function shareTool() {
            alert('Share this tool with others!');
        }

        function supportDeveloper() {
            alert('Support the developer by sharing this tool!');
        }

        function jsonToTypeScript(json) {
            // Basic conversion logic; a real-world scenario would need a more complex solution
            let parsed = JSON.parse(json);
            let tsTypes = 'interface ConvertedType {\n';
            for (let key in parsed) {
                tsTypes += `  ${key}: ${typeof parsed[key]};\n`;
            }
            tsTypes += '}';
            return tsTypes;
        }

        function jsonToPython(json) {
            // Basic conversion logic; a real-world scenario would need a more complex solution
            let parsed = JSON.parse(json);
            let pyTypes = 'class ConvertedType:\n';
            for (let key in parsed) {
                pyTypes += `  ${key}: ${typeof parsed[key]}\n`;
            }
            return pyTypes;
        }

        document.getElementById('convertTS').addEventListener('click', function() {
            let jsonInput = document.getElementById('jsonInput').value;
            try {
                let result = jsonToTypeScript(jsonInput);
                document.getElementById('output').value = result;
            } catch (error) {
                document.getElementById('output').value = 'Invalid JSON';
            }
        });

        document.getElementById('convertPy').addEventListener('click', function() {
            let jsonInput = document.getElementById('jsonInput').value;
            try {
                let result = jsonToPython(jsonInput);
                document.getElementById('output').value = result;
            } catch (error) {
                document.getElementById('output').value = 'Invalid JSON';
            }
        });
    </script>
</body>
</html>
