<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
    </style>
</head>
<body class="font-sans antialiased">
    <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
        <h1 class="text-lg">JSON to TypeScript/Python Converter</h1>
        <div>
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded mr-2" onclick="shareTool()">Share Tool</button>
            <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded" onclick="supportDeveloper()">Support Developer</button>
        </div>
    </div>
    <div class="p-6">
        <textarea id="jsonInput" class="w-full h-40 p-2 mb-4 bg-gray-800 text-white border border-gray-600" placeholder="Paste your JSON here..."></textarea>
        <div class="flex mb-4">
            <button class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded mr-2" onclick="convertToTypeScript()">Convert to TypeScript</button>
            <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded" onclick="convertToPython()">Convert to Python</button>
        </div>
        <textarea id="output" class="w-full h-40 p-2 bg-gray-800 text-white border border-gray-600" placeholder="Output will appear here..." readonly></textarea>
    </div>
    <script>
        function shareTool() {
            alert('Sharing functionality is not implemented.');
        }

        function supportDeveloper() {
            alert('Support functionality is not implemented.');
        }

        function convertToTypeScript() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const typeScript = jsonToTypeScript(jsonObject);
                document.getElementById('output').value = typeScript;
            } catch (error) {
                alert('Invalid JSON');
            }
        }

        function convertToPython() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const python = jsonToPython(jsonObject);
                document.getElementById('output').value = python;
            } catch (error) {
                alert('Invalid JSON');
            }
        }

        function jsonToTypeScript(obj, indent = '  ') {
            let output = '';
            for (let key in obj) {
                const value = obj[key];
                const type = Array.isArray(value) ? 'any[]' : typeof value;
                output += `${indent}${key}: ${type};\n`;
            }
            return `interface RootObject {\n${output}}\n`;
        }

        function jsonToPython(obj, indent = '    ') {
            let output = 'class RootObject:\n';
            for (let key in obj) {
                let type = typeof obj[key];
                if (Array.isArray(obj[key])) type = 'list';
                if (obj[key] === null) type = 'Any';

                output += `${indent}${key}: ${type}\n`;
            }
            return `${output}`;
        }
    </script>
</body>
</html>
