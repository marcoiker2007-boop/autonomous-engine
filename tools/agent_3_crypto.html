<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Gas Fee & Gwei Profit Estimator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #eaeaea; }
    </style>
</head>
<body>
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center bg-gray-800 p-4 rounded-lg shadow-lg">
            <h1 class="text-xl font-bold">Web3 Gas Fee & Gwei Profit Estimator</h1>
            <div>
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full mr-2">Share Tool</button>
                <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-full">Support Developer</button>
            </div>
        </div>
        <div class="mt-8 bg-gray-800 p-6 rounded-lg shadow-lg">
            <form id="estimatorForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Current Gas Price (Gwei)</label>
                    <input type="number" id="gasPrice" class="w-full p-2 border border-gray-700 rounded-lg bg-gray-900" placeholder="Enter current gas price in Gwei">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Transaction Gas Limit</label>
                    <input type="number" id="gasLimit" class="w-full p-2 border border-gray-700 rounded-lg bg-gray-900" placeholder="Enter gas limit for transaction">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Expected Gwei Increase (%)</label>
                    <input type="number" id="gweiIncrease" class="w-full p-2 border border-gray-700 rounded-lg bg-gray-900" placeholder="Enter expected Gwei increase percentage">
                </div>
                <button type="button" onclick="calculateProfit()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg">Estimate Profit</button>
            </form>
            <div id="result" class="mt-4 text-lg font-semibold"></div>
        </div>
    </div>
    <script>
        function calculateProfit() {
            const gasPrice = parseFloat(document.getElementById('gasPrice').value);
            const gasLimit = parseFloat(document.getElementById('gasLimit').value);
            const gweiIncrease = parseFloat(document.getElementById('gweiIncrease').value);

            if (isNaN(gasPrice) || isNaN(gasLimit) || isNaN(gweiIncrease)) {
                document.getElementById('result').textContent = 'Please enter valid numbers in all fields.';
                return;
            }

            const initialCost = gasPrice * gasLimit;
            const newGasPrice = gasPrice * (1 + gweiIncrease / 100);
            const newCost = newGasPrice * gasLimit;
            const profit = newCost - initialCost;

            document.getElementById('result').textContent = `Estimated Profit: ${profit.toFixed(2)} Gwei`;
        }
    </script>
</body>
</html>
