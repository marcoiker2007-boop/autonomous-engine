<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Outreach Subject Line Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a202c;
            color: #cbd5e0;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
    <header class="w-full bg-gray-800 p-4 flex justify-between items-center">
        <h1 class="text-xl text-white">Cold Outreach Subject Line Analyzer</h1>
        <div>
            <button onclick="shareTool()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">Share Tool</button>
            <button onclick="supportDeveloper()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
        </div>
    </header>
    <main class="flex-grow w-full max-w-md p-4">
        <div class="mb-4">
            <label for="subjectLine" class="block text-sm font-medium text-gray-300">Enter Subject Line:</label>
            <input type="text" id="subjectLine" class="mt-1 p-2 w-full border rounded bg-gray-700 text-white focus:outline-none focus:ring focus:border-blue-300" placeholder="Type your subject line here">
        </div>
        <button onclick="analyzeSubjectLine()" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded w-full">Analyze</button>
        <div id="result" class="mt-4 text-sm"></div>
    </main>
    <script>
        function shareTool() {
            alert('Share this tool with your friends!');
        }

        function supportDeveloper() {
            alert('Thank you for supporting the developer!');
        }

        function analyzeSubjectLine() {
            const subjectLine = document.getElementById('subjectLine').value;
            const resultDiv = document.getElementById('result');

            if (!subjectLine) {
                resultDiv.innerText = 'Please enter a subject line to analyze.';
                resultDiv.className = 'text-red-500 mt-4 text-sm';
                return;
            }

            const analysis = performAnalysis(subjectLine);
            resultDiv.innerText = `Analysis Result: ${analysis}`;
            resultDiv.className = 'text-green-500 mt-4 text-sm';
        }

        function performAnalysis(subjectLine) {
            // Dummy analysis logic for demonstration purposes
            const length = subjectLine.length;
            if (length < 10) {
                return 'Too short. Try to add more details.';
            } else if (length > 50) {
                return 'Too long. Make it more concise.';
            } else {
                return 'Good length. Well-balanced.';
            }
        }
    </script>
</body>
</html>
