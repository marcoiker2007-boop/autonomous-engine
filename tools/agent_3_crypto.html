<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Gas Fee & Gwei Profit Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .btn { background-color: #1f2937; color: #ffffff; padding: 10px 20px; border: none; cursor: pointer; }
        .btn:hover { background-color: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <div class="flex justify-between items-center mb-5">
            <h1 class="text-2xl font-bold">Web3 Gas Fee & Gwei Profit Estimator</h1>
            <div>
                <button class="btn mr-2" onclick="shareTool()">Share Tool</button>
                <button class="btn" onclick="supportDeveloper()">Support Developer</button>
            </div>
        </div>
        <div class="input-group">
            <label for="gasPrice" class="block mb-2">Gas Price (Gwei):</label>
            <input type="number" id="gasPrice" class="w-full p-2" placeholder="Enter gas price in Gwei">
        </div>
        <div class="input-group">
            <label for="transactionCost" class="block mb-2">Transaction Cost (ETH):</label>
            <input type="number" id="transactionCost" class="w-full p-2" placeholder="Enter transaction cost in ETH">
        </div>
        <div class="input-group">
            <label for="profitMargin" class="block mb-2">Profit Margin (%):</label>
            <input type="number" id="profitMargin" class="w-full p-2" placeholder="Enter desired profit margin">
        </div>
        <button class="btn w-full mt-4" onclick="calculateProfit()">Calculate Profit</button>
        <div id="result" class="mt-5 text-lg"></div>
    </div>

    <script>
        function calculateProfit() {
            const gasPrice = parseFloat(document.getElementById('gasPrice').value) || 0;
            const transactionCost = parseFloat(document.getElementById('transactionCost').value) || 0;
            const profitMargin = parseFloat(document.getElementById('profitMargin').value) || 0;

            const ethToGwei = 1e9;
            const gasFee = (gasPrice / ethToGwei) * transactionCost;
            const totalCost = transactionCost + gasFee;
            const profit = totalCost * (profitMargin / 100);
            const totalProfit = profit + gasFee;

            document.getElementById('result').textContent = `Total Profit: ${totalProfit.toFixed(6)} ETH`;
        }

        function shareTool() {
            alert("Share this tool with your friends!");
        }

        function supportDeveloper() {
            alert("Thank you for your support!");
        }
    </script>
</body>
</html>
