<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Gas Fee & Gwei Profit Estimator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script>
        function calculateProfit() {
            const gasPrice = parseFloat(document.getElementById('gasPrice').value);
            const gasUsed = parseFloat(document.getElementById('gasUsed').value);
            const ethPrice = parseFloat(document.getElementById('ethPrice').value);
            
            if (!gasPrice || !gasUsed || !ethPrice) {
                alert('Please enter valid values');
                return;
            }
            
            const gasFee = (gasPrice * gasUsed) / 1e9;
            const gweiCost = gasFee * ethPrice;
            document.getElementById('result').textContent = `Gas Fee: ${gasFee.toFixed(6)} ETH ($${gweiCost.toFixed(2)})`;
        }

        function shareTool() {
            alert('Share functionality is not implemented.');
        }

        function supportDeveloper() {
            alert('Support functionality is not implemented.');
        }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="max-w-lg mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Web3 Gas Fee & Gwei Profit Estimator</h1>
            <div>
                <button onclick="shareTool()" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded mr-2">Share Tool</button>
                <button onclick="supportDeveloper()" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">Support Developer</button>
            </div>
        </div>
        <div class="bg-gray-800 p-4 rounded shadow">
            <div class="mb-4">
                <label for="gasPrice" class="block text-sm font-medium mb-2">Gas Price (Gwei)</label>
                <input type="number" id="gasPrice" class="w-full px-3 py-2 bg-gray-700 text-white rounded" placeholder="Enter Gas Price in Gwei">
            </div>
            <div class="mb-4">
                <label for="gasUsed" class="block text-sm font-medium mb-2">Gas Used</label>
                <input type="number" id="gasUsed" class="w-full px-3 py-2 bg-gray-700 text-white rounded" placeholder="Enter Gas Used">
            </div>
            <div class="mb-4">
                <label for="ethPrice" class="block text-sm font-medium mb-2">ETH Price (USD)</label>
                <input type="number" id="ethPrice" class="w-full px-3 py-2 bg-gray-700 text-white rounded" placeholder="Enter ETH Price in USD">
            </div>
            <button onclick="calculateProfit()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded">Calculate</button>
            <div id="result" class="mt-4 text-lg font-semibold"></div>
        </div>
    </div>
</body>
</html>
