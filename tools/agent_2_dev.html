<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #f7fafc; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex flex-col items-center h-screen">
    <header class="w-full p-4 bg-gray-800 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">JSON Type Converter</h1>
        <div>
            <button class="bg-blue-500 text-white px-4 py-2 rounded mr-2" onclick="shareTool()">Share Tool</button>
            <button class="bg-green-500 text-white px-4 py-2 rounded" onclick="supportDeveloper()">Support Developer</button>
        </div>
    </header>
    <main class="flex flex-auto flex-col items-center justify-center w-full max-w-3xl px-4">
        <textarea id="jsonInput" class="w-full p-2 bg-gray-700 text-white rounded mb-4" rows="10" placeholder="Paste your JSON here..."></textarea>
        <div class="flex mb-4">
            <button class="bg-indigo-500 text-white px-4 py-2 rounded mr-2" onclick="convertToTypeScript()">Convert to TypeScript</button>
            <button class="bg-yellow-500 text-white px-4 py-2 rounded" onclick="convertToPython()">Convert to Python</button>
        </div>
        <pre id="output" class="w-full p-4 bg-gray-700 text-white rounded hidden"></pre>
    </main>
    <script>
        function clearOutput() {
            const output = document.getElementById('output');
            output.textContent = '';
            output.classList.add('hidden');
        }

        function convertToTypeScript() {
            clearOutput();
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const tsOutput = jsonToTypeScript(jsonObject);
                displayOutput(tsOutput);
            } catch (error) {
                displayOutput('Invalid JSON: ' + error.message);
            }
        }

        function convertToPython() {
            clearOutput();
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                const pyOutput = jsonToPython(jsonObject);
                displayOutput(pyOutput);
            } catch (error) {
                displayOutput('Invalid JSON: ' + error.message);
            }
        }

        function jsonToTypeScript(jsonObject, indent = '') {
            if (Array.isArray(jsonObject)) {
                return `Array<${jsonToTypeScript(jsonObject[0], indent)}>`;
            } else if (typeof jsonObject === 'object' && jsonObject !== null) {
                let result = '{\n';
                for (const key in jsonObject) {
                    result += `${indent}  ${key}: ${jsonToTypeScript(jsonObject[key], indent + '  ')};\n`;
                }
                result += `${indent}}`;
                return result;
            } else {
                return typeof jsonObject;
            }
        }

        function jsonToPython(jsonObject, indent = '') {
            if (Array.isArray(jsonObject)) {
                return `List[${jsonToPython(jsonObject[0], indent)}]`;
            } else if (typeof jsonObject === 'object' && jsonObject !== null) {
                let result = 'Dict[\n';
                for (const key in jsonObject) {
                    result += `${indent}  "${key}": ${jsonToPython(jsonObject[key], indent + '  ')},\n`;
                }
                result += `${indent}]`;
                return result;
            } else {
                return typeof jsonObject === 'string' ? 'str' : typeof jsonObject;
            }
        }

        function displayOutput(content) {
            const output = document.getElementById('output');
            output.textContent = content;
            output.classList.remove('hidden');
        }

        function shareTool() {
            alert('Share this tool with others!');
        }

        function supportDeveloper() {
            alert('Thank you for your support!');
        }
    </script>
</body>
</html>
