<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meta & OpenGraph Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">
    <div class="flex justify-between items-center p-4 bg-gray-800">
        <h1 class="text-xl font-bold">Meta & OpenGraph Previewer</h1>
        <div>
            <button onclick="shareTool()" class="bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded">Share Tool</button>
            <button onclick="supportDeveloper()" class="bg-green-600 hover:bg-green-500 text-white py-2 px-4 rounded">Support Developer</button>
        </div>
    </div>

    <div class="p-4 space-y-4">
        <input id="urlInput" type="url" placeholder="Enter website URL" class="w-full p-2 bg-gray-800 border border-gray-700 rounded" oninput="fetchMeta()">
        <div id="preview" class="p-4 bg-gray-800 border border-gray-700 rounded">
            <p class="text-gray-400">Enter a URL to see its Meta & OpenGraph preview.</p>
        </div>
    </div>

    <script>
        async function fetchMeta() {
            const url = document.getElementById('urlInput').value;
            if (!url) return;
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const metaTags = doc.querySelectorAll('meta');
                let previewContent = '';
                metaTags.forEach(tag => {
                    const property = tag.getAttribute('property') || tag.getAttribute('name');
                    const content = tag.getAttribute('content');
                    if (property && content) {
                        previewContent += `<p><strong>${property}:</strong> ${content}</p>`;
                    }
                });
                document.getElementById('preview').innerHTML = previewContent || '<p class="text-gray-400">No Meta or OpenGraph data found.</p>';
            } catch (error) {
                document.getElementById('preview').innerHTML = '<p class="text-red-500">Error fetching data.</p>';
            }
        }

        function shareTool() {
            alert('Share Tool feature coming soon!');
        }

        function supportDeveloper() {
            alert('Support Developer feature coming soon!');
        }
    </script>
</body>

</html>
