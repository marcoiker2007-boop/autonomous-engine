<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to TypeScript/Python Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
        textarea { resize: none; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">
    <header class="w-full flex justify-between items-center p-4 bg-gray-800 shadow-lg mb-4">
        <h1 class="text-xl font-bold text-white">JSON to TypeScript/Python Converter</h1>
        <div>
            <button onclick="shareTool()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2">Share Tool</button>
            <button onclick="supportDeveloper()" class="bg-green-500 text-white px-4 py-2 rounded">Support Developer</button>
        </div>
    </header>
    <main class="flex flex-col md:flex-row w-full max-w-4xl space-y-4 md:space-y-0 md:space-x-4">
        <textarea id="jsonInput" class="w-full h-60 p-2 bg-gray-700 text-white rounded" placeholder="Paste JSON here..."></textarea>
        <div class="flex flex-col w-full space-y-2">
            <button onclick="convertToTypeScript()" class="w-full bg-indigo-500 text-white px-4 py-2 rounded">Convert to TypeScript</button>
            <button onclick="convertToPython()" class="w-full bg-yellow-500 text-white px-4 py-2 rounded">Convert to Python</button>
        </div>
        <textarea id="codeOutput" class="w-full h-60 p-2 bg-gray-700 text-white rounded" placeholder="Converted code will appear here..." readonly></textarea>
    </main>
    <script>
        function shareTool() {
            alert("Share this tool with your friends!");
        }

        function supportDeveloper() {
            alert("Thank you for supporting the developer!");
        }

        function convertToTypeScript() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                let tsOutput = '';
                for (const [key, value] of Object.entries(jsonObject)) {
                    tsOutput += `let ${key}: ${typeof value};\n`;
                }
                document.getElementById('codeOutput').value = tsOutput;
            } catch (error) {
                document.getElementById('codeOutput').value = 'Invalid JSON input.';
            }
        }

        function convertToPython() {
            const jsonInput = document.getElementById('jsonInput').value;
            try {
                const jsonObject = JSON.parse(jsonInput);
                let pythonOutput = '';
                for (const [key, value] of Object.entries(jsonObject)) {
                    pythonOutput += `${key} = ${JSON.stringify(value)}\n`;
                }
                document.getElementById('codeOutput').value = pythonOutput;
            } catch (error) {
                document.getElementById('codeOutput').value = 'Invalid JSON input.';
            }
        }
    </script>
</body>
</html>
