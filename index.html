<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold mb-6 text-center">Unit Converter</h1>
        <div class="mb-4">
            <label class="block text-sm mb-2">Enter Value:</label>
            <input id="inputValue" type="number" class="w-full px-4 py-2 border rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-600">
        </div>
        <div class="mb-4">
            <label class="block text-sm mb-2">From:</label>
            <select id="fromUnit" class="w-full px-4 py-2 border rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-600">
                <option value="meters">Meters</option>
                <option value="kilometers">Kilometers</option>
                <option value="feet">Feet</option>
                <option value="miles">Miles</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block text-sm mb-2">To:</label>
            <select id="toUnit" class="w-full px-4 py-2 border rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-600">
                <option value="meters">Meters</option>
                <option value="kilometers">Kilometers</option>
                <option value="feet">Feet</option>
                <option value="miles">Miles</option>
            </select>
        </div>
        <button onclick="convert()" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-600">Convert</button>
        <div class="mt-6">
            <label class="block text-sm mb-2">Converted Value:</label>
            <div id="outputValue" class="text-lg font-semibold">0</div>
        </div>
    </div>
    <script>
        const conversionRates = {
            meters: { meters: 1, kilometers: 0.001, feet: 3.28084, miles: 0.000621371 },
            kilometers: { meters: 1000, kilometers: 1, feet: 3280.84, miles: 0.621371 },
            feet: { meters: 0.3048, kilometers: 0.0003048, feet: 1, miles: 0.000189394 },
            miles: { meters: 1609.34, kilometers: 1.60934, feet: 5280, miles: 1 }
        };

        function convert() {
            const inputValue = parseFloat(document.getElementById('inputValue').value);
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            const convertedValue = inputValue * conversionRates[fromUnit][toUnit];
            document.getElementById('outputValue').innerText = isNaN(convertedValue) ? 'Invalid Input' : convertedValue.toFixed(4);
        }
    </script>
</body>
</html>
