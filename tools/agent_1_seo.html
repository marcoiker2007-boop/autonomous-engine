<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Meta & OpenGraph Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #cbd5e0; }
        header { background-color: #2d3748; }
        input, textarea { background-color: #2d3748; color: #e2e8f0; }
    </style>
</head>
<body class="font-sans">
    <header class="flex justify-between items-center p-4 shadow-lg">
        <h1 class="text-lg font-bold">Live Meta & OpenGraph Previewer</h1>
        <div>
            <button onclick="shareTool()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Share Tool</button>
            <button onclick="supportDeveloper()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
        </div>
    </header>
    <main class="p-4">
        <div class="mb-4">
            <label for="metaTagsInput" class="block text-sm font-medium mb-2">Enter Meta Tags:</label>
            <textarea id="metaTagsInput" class="w-full p-2 rounded" rows="5" placeholder="<meta name='description' content='...'>\n<meta property='og:title' content='...'>"></textarea>
        </div>
        <div>
            <button onclick="previewMetaTags()" class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded">Preview</button>
        </div>
        <div id="preview" class="mt-4 p-4 bg-gray-800 rounded"></div>
    </main>
    <script>
        function shareTool() {
            navigator.share({ title: 'Live Meta & OpenGraph Previewer', url: window.location.href });
        }

        function supportDeveloper() {
            window.open('https://www.buymeacoffee.com/', '_blank');
        }

        function previewMetaTags() {
            const input = document.getElementById('metaTagsInput').value;
            const previewDiv = document.getElementById('preview');
            previewDiv.innerHTML = input ? input : '<p class="text-red-500">Please enter valid meta tags.</p>';
        }
    </script>
</body>
</html>
