<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Outreach Subject Line Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #edf2f7;
        }
    </style>
</head>
<body class="flex flex-col items-center p-6">
    <header class="w-full flex justify-between items-center py-4 mb-6 border-b border-gray-700">
        <h1 class="text-2xl font-bold">Cold Outreach Subject Line Analyzer</h1>
        <div>
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">Share Tool</button>
            <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Support Developer</button>
        </div>
    </header>
    <main class="w-full max-w-lg">
        <textarea id="subjectInput" class="w-full p-2 mb-4 bg-gray-800 text-white rounded" rows="3" placeholder="Enter your subject line..."></textarea>
        <button onclick="analyzeSubjectLine()" class="w-full bg-teal-500 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded mb-4">Analyze</button>
        <div id="analysisResult" class="bg-gray-800 p-4 rounded"></div>
    </main>
    <script>
        function analyzeSubjectLine() {
            const input = document.getElementById('subjectInput').value;
            const resultDiv = document.getElementById('analysisResult');

            if (!input.trim()) {
                resultDiv.textContent = 'Please enter a subject line to analyze.';
                return;
            }

            let score = 0;
            const words = input.split(' ');

            if (words.length < 5) score += 10;
            if (/[?!]/.test(input)) score += 10;
            if (/free|limited|offer/i.test(input)) score -= 10;
            if (/[A-Z]/.test(input)) score += 5;

            const feedback = `
                Subject Line: "${input}"
                Length Score: ${words.length < 5 ? 'Good' : 'Too long'}
                Punctuation: ${/[?!]/.test(input) ? 'Engaging' : 'Neutral'}
                Spammy Words: ${/free|limited|offer/i.test(input) ? 'Avoid' : 'Clean'}
                Capitalization: ${/[A-Z]/.test(input) ? 'Attention Grabbing' : 'Neutral'}
                Overall Score: ${score}/30
            `;

            resultDiv.textContent = feedback;
        }
    </script>
</body>
</html>
