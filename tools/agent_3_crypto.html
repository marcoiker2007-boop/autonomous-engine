<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Gas Fee & Gwei Profit Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: #e2e8f0; }
        button { transition: background-color 0.3s; }
        button:hover { background-color: #2d3748; }
    </style>
</head>
<body>
    <div class="max-w-xl mx-auto p-5">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Gas Fee & Gwei Profit Estimator</h1>
            <div>
                <button class="bg-teal-500 text-white px-4 py-2 mr-2 rounded" onclick="shareTool()">Share Tool</button>
                <button class="bg-teal-500 text-white px-4 py-2 rounded" onclick="supportDeveloper()">Support Developer</button>
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Gas Price (Gwei)</label>
            <input type="number" id="gasPrice" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Enter gas price in Gwei">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Transaction Fee (ETH)</label>
            <input type="number" id="transactionFee" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Enter transaction fee in ETH">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Profit Margin (%)</label>
            <input type="number" id="profitMargin" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Enter desired profit margin">
        </div>
        <button class="w-full bg-teal-500 text-white px-4 py-2 rounded" onclick="calculateProfit()">Calculate</button>
        <div id="result" class="mt-4 p-4 bg-gray-900 rounded hidden">
            <p id="gasCost" class="text-sm mb-2"></p>
            <p id="totalCost" class="text-sm mb-2"></p>
            <p id="profit" class="text-sm font-bold"></p>
        </div>
    </div>
    <script>
        function calculateProfit() {
            const gasPrice = parseFloat(document.getElementById('gasPrice').value) || 0;
            const transactionFee = parseFloat(document.getElementById('transactionFee').value) || 0;
            const profitMargin = parseFloat(document.getElementById('profitMargin').value) || 0;

            const gasCost = gasPrice * transactionFee;
            const totalCost = gasCost + transactionFee;
            const profit = totalCost * (profitMargin / 100);

            document.getElementById('gasCost').textContent = `Gas Cost: ${gasCost.toFixed(6)} ETH`;
            document.getElementById('totalCost').textContent = `Total Cost: ${totalCost.toFixed(6)} ETH`;
            document.getElementById('profit').textContent = `Estimated Profit: ${profit.toFixed(6)} ETH`;

            document.getElementById('result').classList.remove('hidden');
        }

        function shareTool() {
            alert('Share this tool with your friends!');
        }

        function supportDeveloper() {
            alert('Support the developer by donating or sharing this tool!');
        }
    </script>
</body>
</html>
